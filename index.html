<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKF - LISECKA KAMPANIA FILMOWA</title>
    <style>
        /* RESET STYLÓW - PODSTAWA STABILNOŚCI */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666666;
            margin-top: 5px;
        }

        /* SIATKA Z FILMAMI - RESPONSYWNA I STABILNA */
        .video-feed {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 80px;
        }

        /* KARTA FILMU */
        .video-card {
            background: #111111;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222222;
            display: flex;
            flex-direction: column;
        }

        /* Delikatne podświetlenie karty na komputerach */
        @media (min-width: 768px) {
            .video-card:hover {
                border-color: #555555;
            }
        }

        /* FORMAT ODTWARZACZA 9:16 */
        .video-container {
            position: relative;
            padding-bottom: 177.77%;
            height: 0;
            background: #000000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 20px;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .interaction-bar {
            display: flex;
        }

        .like-btn {
            background: #222222;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .like-btn:hover {
            background: #333333;
        }

        /* PROSTY I NIEZAWODNY MODAL STARTOWY */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-box {
            background: #111111;
            border: 2px solid #222222;
            padding: 30px 20px;
            border-radius: 15px;
            max-width: 380px;
            width: 90%;
            text-align: center;
        }

        .welcome-icon {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .welcome-text {
            font-size: 1rem;
            line-height: 1.5;
            color: #dddddd;
            margin-bottom: 25px;
        }

        .welcome-btn {
            background: #10b981;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
        }

        .welcome-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div id="startPopUp" class="welcome-overlay">
        <div class="welcome-box">
            <div class="welcome-icon">🎬</div>
            <p class="welcome-text">Nowe filmy będą dodawane co jakiś czas, więc odwiedzaj stronę regularnie!</p>
            <button class="welcome-btn" onclick="document.getElementById('startPopUp').style.display='none';">Przyjmuję do wiadomości</button>
        </div>
    </div>

    <header>
        <div class="logo">LKF</div>
        <div class="subtitle">Lisecka Kampania Filmowa</div>
    </header>

    <main class="video-feed">
        
        <div class="video-card">
            <div class="video-container">
                <iframe src="https://streamable.com/e/b4xaxh" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-title">Początki LKF odc. 1</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">84</span></button>
                </div>
            </div>
        </div>

        <div class="video-card">
            <div class="video-container">
                <iframe src="https://streamable.com/e/472z5x" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-title">Początki LKF odc. 2</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">62</span></button>
                </div>
            </div>
        </div>

        <div class="video-card">
            <div class="video-container">
                <iframe src="https://streamable.com/e/ppshdk" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-title">Początki LKF odc. 3</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">71</span></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // SYSTEM LAJKÓW
        function fakeLike(button) {
            let countSpan = button.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);
            countSpan.innerText = currentLikes + 1;
            
            button.disabled = true;
            button.style.opacity = "0.5";
        }
    </script>
</body>
</html>
