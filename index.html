<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKF - LISECKA KAMPANIA FILMOWA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: #ffffff;
            text-transform: uppercase;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo:hover {
            transform: scale(1.08);
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #555;
            margin-top: 5px;
        }

        /* Siatka z filmami - umożliwia scrolowanie w dół */
        .video-feed {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 50px;
            padding-bottom: 100px;
        }

        .video-card {
            background: #101010;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-10px);
            border-color: #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Idealny pionowy format 9:16 pod telefony i Shorts */
        .video-container {
            position: relative;
            padding-bottom: 177.77%; 
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 20px;
        }

        .video-meta {
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 15px;
        }

        .interaction-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .like-btn {
            background: #161616;
            border: 1px solid #252525;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .like-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LKF</div>
        <div class="subtitle">Lisecka Kampania Filmowa</div>
    </header>

    <main class="video-feed">
        
        <!-- FILM 1 (TWÓJ AKTUALNY FILM ZE STREAMABLE) -->
        <div class="video-card">
            <div class="video-container">
                <iframe src="https://streamable.com/e/b4xaxh" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-meta">Opublikowano: 2 czerwca 2026</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">84</span></button>
                </div>
            </div>
        </div>

        <!-- FILM 2 (DODATKOWY FILM DO SCROLLOWANIA) -->
        <div class="video-card">
            <div class="video-container">
                <iframe src="https://streamable.com/e/mo99" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-meta">Opublikowano: 28 maja 2026</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">42</span></button>
                </div>
            </div>
        </div>

        <!-- FILM 3 (DODATKOWY FILM DO SCROLLOWANIA) -->
        <div class="video-card">
            <div class="video-container">
                <iframe src="https://streamable.com/e/it5g" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <div class="video-meta">Opublikowano: 15 maja 2026</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">67</span></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Funkcja wizualnego dodawania lajka bez bazy danych
        function fakeLike(button) {
            let countSpan = button.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);
            countSpan.innerText = currentLikes + 1;
            
            button.disabled = true;
            button.style.opacity = "0.5";
        }
    </script>
</body>
</html>
