<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKF - LISECKA KAMPANIA FILMOWA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* Elegancki czarny kursor dla całej strony */
        html, body {
            background-color: #050505;
            color: #ffffff;
            padding: 40px 20px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M4.5 2.25l15 11.25-6.75 1.5 4.5 6.75-3 2-4.5-6.75-5.25 4.5z"/></svg>'), auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: #ffffff;
            text-transform: uppercase;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo:hover {
            transform: scale(1.08);
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #555;
            margin-top: 5px;
        }

        .video-feed {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            padding-bottom: 100px;
        }

        /* Karta filmu z efektem podświetlania po najechaniu myszką */
        .video-card {
            background: #101010;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
        }

        /* Efekt podświetlenia gdy najeżdżasz kursorem */
        .video-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15), 0 20px 40px rgba(0,0,0,0.9);
        }

        /* Format 9:16 z warstwą blokującą start pod animację */
        .video-container {
            position: relative;
            padding-bottom: 177.77%; 
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Niewidzialna powłoka ułatwiająca kliknięcie w celu wywołania animacji play */
        .video-click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
            cursor: pointer;
        }

        .video-info {
            padding: 25px;
        }

        /* Styl dedykowany dla tytułu filmu */
        .video-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 15px;
        }

        .interaction-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .like-btn {
            background: #161616;
            border: 1px solid #252525;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .like-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Pełnoekranowa kinowa animacja PLAY */
        .play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .play-overlay.active {
            opacity: 1;
        }

        .play-icon-animation {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(255,255,255,0.6);
        }

        .play-overlay.active .play-icon-animation {
            transform: scale(1.3);
        }

        .play-icon-animation svg {
            width: 40px;
            height: 40px;
            fill: #050505;
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <!-- Ekran animacji PLAY -->
    <div id="playAnimationScreen" class="play-overlay">
        <div class="play-icon-animation">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </div>

    <header>
        <div class="logo">LKF</div>
        <div class="subtitle">Lisecka Kampania Filmowa</div>
    </header>

    <main class="video-feed">
        
        <!-- JEDYNY FILM (TWÓJ ODCINEK ZE STREAMABLE) -->
        <div class="video-card">
            <div class="video-container">
                <!-- Nakładka przechwytująca pierwsze kliknięcie, żeby wywołać animację -->
                <div class="video-click-overlay" onclick="triggerPlayAnimation(this, 'streamable-frame-1')"></div>
                <iframe id="streamable-frame-1" src="https://streamable.com/e/b4xaxh?autoplay=0" allow="autoplay" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <!-- Tytuł Twojego pierwszego wideo -->
                <div class="video-title">LKF - Odcinek 1</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">84</span></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Funkcja obsługująca kinową animację PLAY na cały ekran
        function triggerPlayAnimation(overlayElement, iframeId) {
            const animationScreen = document.getElementById('playAnimationScreen');
            const iframe = document.getElementById(iframeId);
            
            // 1. Włączamy pełnoekranową animację
            animationScreen.classList.add('active');
            
            // 2. Usuwamy nakładkę kliknięcia, żeby można było normalnie pauzować film w playerze
            overlayElement.remove();
            
            // 3. Po 800ms gasimy animację i odpalamy wideo z funkcją autoplay
            setTimeout(() => {
                animationScreen.classList.remove('active');
                // Dodajemy komendę autoplay do linku ze Streamable
                let currentSrc = iframe.src;
                iframe.src = currentSrc.replace('autoplay=0', 'autoplay=1');
            }, 800);
        }

        // Prosta funkcja fejkowych lajków
        function fakeLike(button) {
            let countSpan = button.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);
            countSpan.innerText = currentLikes + 1;
            
            button.disabled = true;
            button.style.opacity = "0.5";
        }
    </script>
</body>
</html>
