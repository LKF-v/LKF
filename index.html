<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKF - LISECKA KAMPANIA FILMOWA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* CZARNY ELEGANCKI KURSOR DLA PC – AKTYWNY NA CAŁEJ STRONIE I ELEMENTACH KLIKALNYCH */
        html, body {
            background-color: #050505;
            color: #ffffff;
            padding: 40px 20px;
            overflow-x: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="2"><path d="M4.5 2.25l15 11.25-6.75 1.5 4.5 6.75-3 2-4.5-6.75-5.25 4.5z"/></svg>'), auto;
        }

        a, button, .video-card, .video-click-overlay, .modal-btn {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="2"><path d="M4.5 2.25l15 11.25-6.75 1.5 4.5 6.75-3 2-4.5-6.75-5.25 4.5z"/></svg>'), pointer !important;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: #ffffff;
            text-transform: uppercase;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo:hover {
            transform: scale(1.08);
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #555;
            margin-top: 5px;
        }

        /* SIATKA Z FILMAMI PO KOLEI */
        .video-feed {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 50px;
            padding-bottom: 100px;
        }

        /* KARTA FILMU Z POTĘŻNYM EFEKTEM PODŚWIETLENIA */
        .video-card {
            background: #101010;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 30px 60px rgba(0,0,0,0.9);
        }

        .video-container {
            position: relative;
            padding-bottom: 177.77%; 
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        .video-info {
            padding: 25px;
            background: #101010;
            position: relative;
            z-index: 6;
        }

        .video-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 15px;
        }

        .interaction-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .like-btn {
            background: #161616;
            border: 1px solid #252525;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* PEŁNOEKRANOWA ANIMACJA PLAY */
        .play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .play-overlay.active {
            opacity: 1;
        }

        .play-icon-animation {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 60px rgba(255,255,255,0.7);
        }

        .play-overlay.active .play-icon-animation {
            transform: scale(1.2);
        }

        .play-icon-animation svg {
            width: 50px;
            height: 50px;
            fill: #050505;
            margin-left: 6px;
        }

        /* NOWOCZESNY KOMUNIKAT STARTOWY (MODAL) */
        .welcome-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 3, 0.95);
            backdrop-filter: blur(15px);
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-content {
            background: #0f0f0f;
            border: 1px solid #222;
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,255,255,0.03);
            transform: scale(0.9);
            animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes modalPop {
            to { transform: scale(1); }
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: bellRing 1.5s ease infinite alternate;
        }

        @keyframes bellRing {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        .modal-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* ELEGANCKI ZIELONY PRZYCISK ACCENT */
        .modal-btn {
            background: #10b981;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 14px;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            display: block;
        }

        .modal-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>

    <div id="welcomeModal" class="welcome-modal">
        <div class="modal-content">
            <div class="modal-icon">🎬</div>
            <p class="modal-text">Nowe filmy będą dodawane co jakiś czas, więc odwiedzaj stronę regularnie!</p>
            <button class="modal-btn" onclick="closeWelcomeModal()">Przyjmuję do wiadomości</button>
        </div>
    </div>

    <div id="playAnimationScreen" class="play-overlay">
        <div class="play-icon-animation">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </div>

    <header>
        <div class="logo">LKF</div>
        <div class="subtitle">Lisecka Kampania Filmowa</div>
    </header>

    <main class="video-feed">

            </div>
            <div class="video-info">
                <div class="video-title">Początki LKF odc. 1</div>

                    <button class="like-btn" onclick="fakeLike(this)">❤️ <span class="like-count">84</span></button>
                </div>
            </div>
        </div>

                <iframe id="streamable-frame-2" src="https://streamable.com/e/472z5x?autoplay=0" allow="autoplay" allowfullscreen></iframe>
            </div>
