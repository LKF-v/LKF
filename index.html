<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKF - LISECKA KAMPANIA FILMOWA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* UKRYWAMY DOMYŚLNY BIAŁY KURSOR NA KOMPUTERACH */
        @media (min-width: 769px) {
            html, body, a, button, .video-card, .video-click-overlay {
                cursor: none !important;
            }
        }

        /* TWORZYMY NOWY, ELEGANCKI CZARNY KURSOR Z BIAŁĄ POŚWIATĄ */
        #custom-cursor {
            width: 20px;
            height: 20px;
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99999;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            display: none;
        }

        /* Włączamy kursor tylko na urządzeniach z myszką */
        @media (min-width: 769px) {
            #custom-cursor {
                display: block;
            }
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: #ffffff;
            text-transform: uppercase;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo:hover {
            transform: scale(1.08);
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #555;
            margin-top: 5px;
        }

        .video-feed {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            padding-bottom: 100px;
        }

        /* KARTA FILMU */
        .video-card {
            background: #101010;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        /* POTĘŻNY EFEKT PODŚWIETLENIA (HOVER) */
        .video-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffffff; /* Biała ramka po najechaniu */
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 30px 60px rgba(0,0,0,0.9);
        }

        .video-container {
            position: relative;
            padding-bottom: 177.77%; 
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        .video-info {
            padding: 25px;
            background: #101010;
            position: relative;
            z-index: 6;
        }

        /* NOWY POPRAWIONY TYTUŁ */
        .video-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 15px;
        }

        .interaction-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .like-btn {
            background: #161616;
            border: 1px solid #252525;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ANIMACJA PLAY NA PEŁNY EKRAN */
        .play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .play-overlay.active {
            opacity: 1;
        }

        .play-icon-animation {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 60px rgba(255,255,255,0.7);
        }

        .play-overlay.active .play-icon-animation {
            transform: scale(1.2);
        }

        .play-icon-animation svg {
            width: 50px;
            height: 50px;
            fill: #050505;
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <!-- Element czarnego kursora -->
    <div id="custom-cursor"></div>

    <!-- Ekran kinowej animacji PLAY -->
    <div id="playAnimationScreen" class="play-overlay">
        <div class="play-icon-animation">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </div>

    <header>
        <div class="logo">LKF</div>
        <div class="subtitle">Lisecka Kampania Filmowa</div>
    </header>

    <main class="video-feed">
        
        <div class="video-card" onmouseenter="expandCursor()" onmouseleave="shrinkCursor()">
            <div class="video-container">
                <div class="video-click-overlay" onclick="triggerPlayAnimation(this, 'streamable-frame-1')"></div>
                <iframe id="streamable-frame-1" src="https://streamable.com/e/b4xaxh?autoplay=0" allow="autoplay" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <!-- NOWY POPRAWIONY TYTUŁ -->
                <div class="video-title">Początki LKF odc. 1</div>
                <div class="interaction-bar">
                    <button class="like-btn" onclick="fakeLike(this)" onmouseenter="expandCursor()" onmouseleave="shrinkCursor()">❤️ <span class="like-count">84</span></button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // SKRYPT DIZAJNERSKIEGO KURSORA MYSZY
        const cursor = document.getElementById('custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Efekt powiększenia kursora nad filmem/przyciskiem
        function expandCursor() {
            cursor.style.width = '35px';
            cursor.style.height = '35px';
            cursor.style.backgroundColor = 'rgba(255,255,255,0.2)';
        }

        function shrinkCursor() {
            cursor.style.width = '20px';
            cursor.style.height = '20px';
            cursor.style.backgroundColor = '#000000';
        }

        // KINOWA ANIMACJA PLAY
        function triggerPlayAnimation(overlayElement, iframeId) {
            const animationScreen = document.getElementById('playAnimationScreen');
            const iframe = document.getElementById(iframeId);
            
            animationScreen.classList.add('active');
            overlayElement.remove();
            
            setTimeout(() => {
                animationScreen.classList.remove('active');
                let currentSrc = iframe.src;
                iframe.src = currentSrc.replace('autoplay=0', 'autoplay=1');
            }, 900);
        }

        // LIKE BUTTON
        function fakeLike(button) {
            let countSpan = button.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);
            countSpan.innerText = currentLikes + 1;
            
            button.disabled = true;
            button.style.opacity = "0.5";
        }
    </script>
</body>
</html>
